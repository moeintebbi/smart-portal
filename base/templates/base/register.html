{% load static %}
<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>ثبت‌نام | پورتال آموزشی</title>
  <link rel="icon" type="image/png" href="{% static 'volt/assets/img/favicon/favicon-32x32.png' %}" />
  <link href="{% static 'volt/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'volt/css/volt.css' %}" />
</head>

<body class="bg-soft d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <main>
    <section class="container">
      <div class="row justify-content-center form-bg-image"
        data-background-lg="{% static 'volt/assets/img/illustrations/signin.svg' %}">
        <div class="col-12 d-flex align-items-center justify-content-center">
          <div class="bg-white shadow border-0 rounded p-4 p-lg-5 w-100 fmxw-500">

            <div class="text-center mb-4">
              <h1 class="h3">ایجاد حساب کاربری</h1>
            </div>

            <form method="post" action="{% url 'register' %}">
              {% csrf_token %}

              <!-- username -->
              <div class="form-group mb-3">
                <label for="id_username">نام کاربری</label>
                <input type="text" name="username" class="form-control" id="id_username" required />
              </div>

              <!-- email -->
              <div class="form-group mb-3">
                <label for="id_email">ایمیل</label>
                <input type="email" name="email" class="form-control" id="id_email" required />
              </div>

              <!-- password1 -->
              <div class="form-group mb-3">
                <label for="id_password1">رمز عبور</label>
                <input type="password" name="password1" class="form-control" id="id_password1" required />
              </div>

              <!-- password2 -->
              <div class="form-group mb-4">
                <label for="id_password2">تکرار رمز عبور</label>
                <input type="password" name="password2" class="form-control" id="id_password2" required />
              </div>

              <!-- submit -->
              <div class="d-grid">
                <button type="submit" class="btn btn-warning">ثبت‌نام</button>
              </div>
            </form>

            <div class="text-center mt-4">
              <span class="text-muted">قبلاً ثبت‌نام کرده‌اید؟</span>
              <a href="{% url 'login' %}" class="fw-bold">ورود</a>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- JavaScript files -->
  <script src="{% static 'volt/vendor/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'volt/assets/js/volt.js' %}"></script>
</body>

</html>
