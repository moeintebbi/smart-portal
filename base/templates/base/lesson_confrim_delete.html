{% extends 'base.html' %}
{% block title %}حذف درس‌نامه{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card border-danger shadow-sm">
        <div class="card-body">
            <h4 class="text-danger">حذف درس‌نامه</h4>
            <p>آیا مطمئن هستید که می‌خواهید این درس‌نامه را حذف کنید؟</p>
            <p><strong>{{ lesson.title }}</strong></p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'lesson_list' course.id %}" class="btn btn-secondary">بازگشت</a>
                    <button type="submit" class="btn btn-danger">بله، حذف شود</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
